
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sample HTML Page</title>
	<style>
		body { font-family: Arial, sans-serif; line-height: 1.6; padding: 2rem; background:#f7f7f7 }
		.container { max-width:800px; margin:0 auto; background:#fff; padding:1.5rem; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,.08)}
		header h1 { margin:0 0 .5rem }
		footer { font-size:.9rem; color:#666; margin-top:1.5rem }
		.btn { display:inline-block; padding:.5rem .75rem; background:#0078d4; color:#fff; text-decoration:none; border-radius:4px }
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>Hello — Sample Page</h1>
			<p>A minimal HTML template for testing or learning.</p>
		</header>

		<main>
			<section>
				<h2>About</h2>
				<p>This page demonstrates a simple, well-formed HTML document with basic styling.</p>
			</section>

			<section>
				<h2>Contact</h2>
				<form>
					<label for="name">Name</label><br>
					<input id="name" name="name" type="text" placeholder="Your name"><br><br>
					<label for="message">Message</label><br>
					<textarea id="message" name="message" rows="4" cols="40" placeholder="Write something..."></textarea><br><br>
					<button class="btn" type="submit">Send</button>
				</form>
			</section>
		</main>

		<footer>
			<p>© Sample Page — created for demonstration.</p>
		</footer>
	</div>
</body>
</html>
